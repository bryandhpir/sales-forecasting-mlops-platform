
name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Python Unit Tests

    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RUN_LIVE_STACK: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-api.txt httpx

      - name: Run unit tests
        run: python -m pytest tests -q --ignore=tests/test_live_stack.py
