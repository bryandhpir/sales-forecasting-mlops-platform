
name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Python Unit Tests

    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RUN_LIVE_STACK: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-api.txt httpx

      - name: Run unit tests
        run: python -m pytest tests -q --ignore=tests/test_live_stack.py

  docker-build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build FastAPI image
        run: docker build -t sales-forecast-api:ci .

      - name: Start FastAPI container
        run: |
          docker run -d \
            --name sales-api-ci \
            -p 127.0.0.1:8000:8000 \
            sales-forecast-api:ci

      - name: Test health endpoint
        run: |
          curl --fail --show-error \
            --retry 12 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8000/health

      - name: Show container logs
        if: failure()
        run: docker logs sales-api-ci

      - name: Cleanup container
        if: always()
        run: docker rm -f sales-api-ci || true
